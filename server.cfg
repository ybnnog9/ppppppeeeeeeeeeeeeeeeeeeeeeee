# =========================
# FIVE-M SERIOUS RP - BANDAS/PVP
# Maqueta base profesional (ESX Legacy)
# =========================
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 64
set steam_webApiKey "CAMBIAR_POR_TU_KEY"
sv_licenseKey "CAMBIAR_POR_TU_LICENSE"
sv_hostname "[ES] Ciudad Roja RP | Rol Serio + Bandas"
sets sv_projectName "Ciudad Roja RP"
sets sv_projectDesc "Servidor serio de rol con foco en bandas, PVP controlado y economia estable."
sets locale "es-ES"
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.35
setr voice_enableRadioAnim 1
set mysql_connection_string "mysql://fivem:password@127.0.0.1/croja?charset=utf8mb4"

# Seguridad / OneSync
set onesync on
set sv_enforceGameBuild 3258
set sv_endpointprivacy true
set sv_scriptHookAllowed 0
sv_authMaxVariance 1
sv_authMinTrust 5

# Ox stack recomendado
ensure oxmysql
ensure ox_lib
ensure ox_target
ensure ox_inventory

# Base ESX
ensure es_extended
ensure esx_addonaccount
ensure esx_datastore
ensure esx_society
ensure esx_billing
ensure esx_menu_default
ensure esx_menu_dialog
ensure esx_menu_list

# Carga de recursos personalizados
exec resources/[core]/load.cfg
exec resources/[framework]/load.cfg
exec resources/[jobs]/load.cfg
exec resources/[illegal]/load.cfg
exec resources/[pvp]/load.cfg
exec resources/[ui]/load.cfg
exec resources/[maps]/load.cfg
exec resources/[admin]/load.cfg
exec resources/[extra]/load.cfg

# Permisos básicos
add_ace group.admin command allow
add_principal identifier.fivem:1 group.admin

# Idioma
setr cr_locale "es"
